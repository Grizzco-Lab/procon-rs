# Retrieval set for `cuttlefish eval retrieval`: questions with the chunks
# that should come first, over the store's game-data fact cards (Lean's
# datamine, `cuttlefish ingest leanny`), the Inkipedia pages and the
# #vod-review expert comments. No model is asked; it prints recall@1 and
# recall@5 for embeddings, BM25 and both.
#
# expect_sources: substrings of the title, heading or url of a right chunk
# (any one is enough). Expert comments are named by their message id, which
# ends their url.

# Eggstra Work events and waves: near-identical cards told apart by numbers

[[case]]
question = "What spawned in wave 3 of Eggstra Work #7?"
expect_sources = ["Eggstra Work #7 (2024-11-09, Bonerattle Arena), wave 3"]

[[case]]
question = "Eggstra Work #1 wave 2 spawn schedule"
expect_sources = ["Eggstra Work #1 (2023-04-15, Sockeye Station), wave 2"]

[[case]]
question = "Which tide and event was wave 4 of Eggstra Work #10?"
expect_sources = ["Eggstra Work #10 (2025-08-09, Salmonid Smokeyard), wave 4"]

[[case]]
question = "When does the Mothership come in wave 3 of Eggstra Work #12?"
expect_sources = ["Eggstra Work #12 (2026-02-14, Bonerattle Arena), wave 3"]

[[case]]
question = "What were the Rush wave's spawns in Eggstra Work #11?"
expect_sources = ["Eggstra Work #11 (2025-11-08, Gone Fission Hydroplant), wave 2"]

[[case]]
question = "Which stage was Eggstra Work #2 on?"
expect_sources = ["Eggstra Work #2 (2023-07-01, Gone Fission Hydroplant)"]

[[case]]
question = "Eggstra Work #4 wave 4 Giant Tornado spawns"
expect_sources = ["Eggstra Work #4 (2024-02-03, Marooner's Bay), wave 4"]

[[case]]
question = "Eggstra Work #9 wave 1 on low tide: which bosses come first?"
expect_sources = ["Eggstra Work #9 (2025-05-10, Jammin' Salmon Junction), wave 1"]

[[case]]
