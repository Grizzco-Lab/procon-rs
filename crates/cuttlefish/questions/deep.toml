# Cuttlefish's deep question bank: questions a high-level Salmon Run player
# asks, whose answers the community knows. The page offers a few as chips
# next to the chat, `cuttlefish eval deep` asks the model the ones that need
# no video, and the answers are reviewed into expert notes (the "memory").
#
# Each [[question]] has an `id`, a `category` (see `questions::CATEGORIES`:
# macro, openings, bosses, stages, events, eggs, weapons, moments), what it
# `needs` to be answered:
#
#   knowledge     the knowledge store alone
#   video_moment  a moment of a video (frames, HUD, input)
#   video_range   a stretch of a video
#   hud           the HUD read from the video (wave, timer, eggs)
#   detector      a Salmon Run object detector, not trained yet ("coming later")
#
# the question in English (`en`) and Simplified Chinese (`zh`, in the
# official names where the glossary has them; a term without an official
# Chinese name in the glossary stays in English), an optional `note` (what
# is unsure about the question) and `reference`: the id of the expert note
# that answers it, empty until one is written (a note whose `question_id`
# names the question fills it in too).

# ---------------------------------------------------------------- macro

[[question]]
id = "macro-aggressive-start"
category = "macro"
needs = "knowledge"
en = "We usually lure bosses to the basket to kill them, and the Griller moves fast anyway. So why do the first few kills at the start of a wave need to be so aggressive?"
zh = "我们通常把巨大鲑鱼引到蛋筐旁再击杀，Griller 本来就跑得快。那为什么一波开局的前几个击杀要打得那么激进？"

