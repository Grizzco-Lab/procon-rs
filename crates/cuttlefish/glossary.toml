forms = { en = ["Stinger"], ja = ["タワー"], zh = ["高塔鱼"] }

[[term]]
id = "maws"
definition = "Boss that attacks from under the ink; drop a bomb on its marker."
forms = { en = ["Maws"], ja = ["モグラ"], zh = ["鼹鼠鱼"] }

[[term]]
id = "drizzler"
definition = "Boss with an umbrella that launches a rain torpedo; shoot the torpedo back."
