# Weapons and specials with Chinese slang

[[term]]
id = "sploosh-o-matic"
definition = "Very short-ranged shooter with a wide spray and a fast rate of fire."
forms = { en = ["Sploosh-o-matic"], ja = ["ボールドマーカー"], zh = ["广域标记枪"] }
aliases = [
  { lang = "zh", text = "喇叭", note = "'horn', as in 贴牌喇叭枪, the Sploosh-o-matic 7's official name" },
  { lang = "zh", text = "雷神", note = "named after 雷神步" },
]

[[term]]
id = "splattershot"
definition = "The standard all-round shooter."
forms = { en = ["Splattershot"], ja = ["スプラシューター"], zh = ["斯普拉射击枪"] }
aliases = [{ lang = "zh", text = "小绿", note = "'little green'" }]

[[term]]
id = "grizzco-roller"
definition = "The Grizzco Roller, a Grizzco weapon."
forms = { en = ["Grizzco Roller"], ja = ["クマサン印のローラー"], zh = ["熊先生印章滚筒"] }
aliases = [
  { lang = "en", text = "G Roller" },
  { lang = "zh", text = "熊刷", note = "'bear brush'" },
]

[[term]]
id = "killer-wail-51"
definition = "Special weapon: six laser megaphones lock on and fire; in Salmon Run it clears lesser Salmonids and hits bosses at range."
forms = { en = ["Killer Wail 5.1"], ja = ["メガホンレーザー5.1ch"], zh = ["喇叭镭射5.1ch"] }
aliases = [
  { lang = "en", text = "wail" },
  { lang = "ja", text = "メガホン", note = "'megaphone'" },
  { lang = "zh", text = "镭射", note = "'laser', short for 喇叭镭射5.1ch" },
]

# ---------------------------------------------------------------------------
# Player jargon (the studio's chat examples): no names in the game, so the
# official forms are descriptive English and the players' words are aliases.
# English forms marked "unsure" are literal: the English community may have
# no fixed word.

[[term]]
id = "inertia-cancel"
definition = "Movement technique that cancels the momentum of a jump or dash so the player stops or turns at once; used to keep egg runs tight."
# unsure: no established English community term found; "inertia cancel" is literal
forms = { en = ["inertia cancel"] }
aliases = [
  { lang = "en", text = "momentum cancel" },
  { lang = "zh", text = "惯性取消", note = "'inertia cancel'" },
]

[[term]]
id = "egg-run"
definition = "Carrying Golden Eggs to the basket."
forms = { en = ["egg run"], ja = ["納品"] }
aliases = [
  { lang = "en", text = "egg running" },
  { lang = "en", text = "running eggs" },
  { lang = "en", text = "carry eggs" },
  { lang = "zh", text = "搬蛋", note = "'moving eggs'" },
  { lang = "zh", text = "运蛋", note = "'carrying eggs'" },
]

[[term]]
id = "grizzco-weapon"
definition = "A Grizzco-brand weapon, one of the gold rental weapons of Salmon Run."
forms = { en = ["Grizzco weapon"] }
aliases = [
  { lang = "en", text = "G weapon" },
  { lang = "en", text = "bear weapon" },
  { lang = "ja", text = "クマブキ", note = "'bear weapon'" },
  { lang = "ja", text = "クマサン武器" },
  { lang = "zh", text = "熊武", note = "short for 熊武器" },
  { lang = "zh", text = "熊武器", note = "'bear weapon'" },
]

[[term]]
id = "fetch-eggs"
definition = "Leaving the basket area to collect Golden Eggs lying farther out, then coming back; a short trip, not a post."
forms = { en = ["shore run"] }
aliases = [
  { lang = "en", text = "fetch eggs" },
  { lang = "zh", text = "出差", note = "'a business trip': out for eggs and back" },
]

[[term]]
id = "short-range-weapon"
definition = "A light, short-ranged weapon (Splattershot Jr., Sploosh-o-matic, Aerospray, ...): quick at running eggs, weak against bosses at range."
# unsure: English players say "short-range weapon" or name the weapon
forms = { en = ["short-range weapon"] }
aliases = [
  { lang = "en", text = "short-range shooter" },
  { lang = "en", text = "light weapon" },
  { lang = "zh", text = "小枪", note = "'small gun'" },
]

[[term]]
id = "outer-eggs"
definition = "Golden Eggs lying at the edge of the stage, away from the basket."
forms = { en = ["far eggs", "shore eggs"] }
aliases = [{ lang = "zh", text = "外围蛋", note = "'outer eggs'" }]
