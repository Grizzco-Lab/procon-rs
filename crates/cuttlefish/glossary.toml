# Cuttlefish glossary seed: Salmon Run terms across languages.
#
# Each [[term]] has an `id`, a short English `definition`, `forms`: the
# official names per language code (en, ja, zh, es, ru, fr, ...), the main one
# first, and `aliases`: the slang and abbreviations players use, each with its
# language and a short note on its origin or use. Retrieval matches official
# names and aliases in queries and comments; translation uses the target
# language's first official name, and prompts show slang as
# "alias → official".
#
# This seed has English and Japanese names, the Simplified Chinese names of
# the official release (stat.ink's zh-CN translations where it has them),
# the slang Chinese players use, and the player jargon at the end (the
# studio's chat examples); a jargon term has no name in the game, so its
# `forms` are descriptive. A line starting with "# unsure:" marks a name to
# check. Copy it to <data>/glossary.toml, check it and add the other languages
# there (the file in the data folder replaces this one). What you teach or
# approve in the studio goes to <data>/glossary-user.toml instead.

[[term]]
id = "salmon-run"
definition = "The co-op PvE mode: four players collect Golden Eggs over three waves (plus an optional Xtrawave)."
forms = { en = ["Salmon Run", "Salmon Run Next Wave"], ja = ["サーモンラン", "サーモンラン NEXT WAVE"], zh = ["鲑鱼跑"] }
aliases = [
  { lang = "en", text = "SR", note = "abbreviation" },
  { lang = "ja", text = "サモラン", note = "short for サーモンラン" },
  { lang = "zh", text = "打工", note = "'part-time work': Grizzco's jobs" },
]

[[term]]
id = "golden-egg"
definition = "Egg dropped by Boss Salmonids; delivering enough to the basket clears the wave."
forms = { en = ["Golden Egg"], ja = ["金イクラ"], zh = ["金鲑鱼卵"] }
aliases = [
  { lang = "en", text = "gold egg" },
  { lang = "zh", text = "金蛋", note = "'gold egg'" },
]

[[term]]
id = "power-egg"
definition = "Orange eggs from any Salmonid; only count toward the score and pay."
forms = { en = ["Power Egg"], ja = ["イクラ"], zh = ["鲑鱼卵"] }

[[term]]
id = "egg-basket"
definition = "The goal where Golden Eggs are delivered."
forms = { en = ["Egg Basket"], ja = ["イクラコンテナ"], zh = ["蛋筐"] }
aliases = [
  { lang = "en", text = "basket" },
  { lang = "ja", text = "コンテナ", note = "short for イクラコンテナ" },
  { lang = "zh", text = "筐", note = "short for 蛋筐" },
  { lang = "zh", text = "筐边", note = "'by the basket'" },
  { lang = "zh", text = "家里", note = "'home': at the basket" },
]

[[term]]
id = "hazard-level"
definition = "Difficulty percentage of a job, up to 333%."
forms = { en = ["Hazard Level"], ja = ["キケン度"], zh = ["危险度"] }

[[term]]
id = "eggsecutive-vp"
definition = "Highest rank; its points go up to 999."
forms = { en = ["Eggsecutive VP"], ja = ["でんせつ"], zh = ["传说"] }
aliases = [{ lang = "en", text = "EVP", note = "abbreviation" }]

[[term]]
id = "evp-999"
definition = "Eggsecutive VP at the maximum of 999 points."
forms = { en = ["EVP 999"] }
aliases = [
  { lang = "en", text = "max rank" },
  { lang = "ja", text = "カンスト", note = "'counter stop': the counter maxed out" },
]

[[term]]
id = "xtrawave"
definition = "Fourth wave against a King Salmonid once the meter is full."
forms = { en = ["Xtrawave"], ja = ["EX-WAVE"] }

[[term]]
id = "big-run"
definition = "Limited-time event where Salmonids attack a PvP stage."
forms = { en = ["Big Run"], ja = ["ビッグラン"], zh = ["大型跑"] }

[[term]]
id = "eggstra-work"
definition = "Limited-time contest: five waves with a fixed weapon set, scored by Golden Eggs."
forms = { en = ["Eggstra Work"], ja = ["バイトチームコンテスト"], zh = ["团队打工竞赛"] }
aliases = [{ lang = "ja", text = "チームコンテスト", note = "short form" }]

[[term]]
id = "grizzco"
definition = "The company (Mr. Grizz) that runs Salmon Run jobs."
forms = { en = ["Grizzco"], ja = ["クマサン商会"], zh = ["熊先生商会"] }

[[term]]
id = "high-tide"
definition = "Water level with a smaller shore area."
forms = { en = ["High Tide"], ja = ["満潮"], zh = ["满潮"] }
# unsure: whether players say it
aliases = [{ lang = "zh", text = "涨潮", note = "'rising tide'" }]

[[term]]
id = "normal-tide"
definition = "The regular water level."
forms = { en = ["Normal Tide", "Mid Tide"], ja = ["通常"] }

[[term]]
id = "low-tide"
definition = "Water level exposing the lower shore; the basket moves down."
forms = { en = ["Low Tide"], ja = ["干潮"], zh = ["干潮"] }
# unsure: whether players say it
aliases = [{ lang = "zh", text = "退潮", note = "'ebbing tide'" }]

[[term]]
id = "steelhead"
definition = "Boss that grows a bomb on its head and throws it; shoot the bomb to detonate it on the boss."
forms = { en = ["Steelhead"], ja = ["バクダン"], zh = ["炸弹鱼"] }

[[term]]
id = "flyfish"
definition = "Boss with two missile pods; throw a bomb into each open pod."
forms = { en = ["Flyfish"], ja = ["カタパッド"], zh = ["垫肩飞鱼"] }

[[term]]
id = "steel-eel"
definition = "Boss that chases one player leaving ink; shoot the driver at the tail."
forms = { en = ["Steel Eel"], ja = ["ヘビ"], zh = ["蛇鱼"] }

[[term]]
id = "scrapper"
definition = "Armored boss; hit it from the front to stun it, then shoot the exposed back."
forms = { en = ["Scrapper"], ja = ["テッパン"], zh = ["铁板鱼"] }

[[term]]
id = "stinger"
