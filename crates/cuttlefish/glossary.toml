# Cuttlefish glossary seed: Salmon Run terms across languages.
#
# Each [[term]] has an `id`, a short English `definition` and `forms`: the
# names used per language code (en, ja, zh, es, ru, fr, ...), official name
# first, then community slang. Retrieval matches any form in queries and
# comments; translation uses the target language's first form.
#
# This seed has English and Japanese names, the Simplified Chinese names the
# official release uses where they are known, and the player jargon at the
# end (the studio's chat examples). A line starting with "# unsure:" marks a
# name to check. Copy it to <data>/glossary.toml, check it and add the other
# languages there (the file in the data folder replaces this one).

[[term]]
id = "salmon-run"
definition = "The co-op PvE mode: four players collect Golden Eggs over three waves (plus an optional Xtrawave)."
forms = { en = ["Salmon Run", "Salmon Run Next Wave", "SR"], ja = ["サーモンラン", "サーモンラン NEXT WAVE", "サモラン"], zh = ["鲑鱼跑", "打工"] }

[[term]]
id = "golden-egg"
definition = "Egg dropped by Boss Salmonids; delivering enough to the basket clears the wave."
forms = { en = ["Golden Egg", "gold egg"], ja = ["金イクラ"], zh = ["金鲑鱼卵", "金蛋"] }

[[term]]
id = "power-egg"
definition = "Orange eggs from any Salmonid; only count toward the score and pay."
forms = { en = ["Power Egg"], ja = ["イクラ"], zh = ["鲑鱼卵"] }

[[term]]
id = "egg-basket"
definition = "The goal where Golden Eggs are delivered."
forms = { en = ["Egg Basket", "basket"], ja = ["イクラコンテナ", "コンテナ"], zh = ["鲑鱼卵容器", "容器", "篮子"] }

[[term]]
id = "hazard-level"
definition = "Difficulty percentage of a job, up to 333%."
forms = { en = ["Hazard Level"], ja = ["キケン度"], zh = ["危险度"] }

[[term]]
id = "eggsecutive-vp"
definition = "Highest rank; its points go up to 999."
forms = { en = ["Eggsecutive VP", "EVP"], ja = ["でんせつ"], zh = ["传说"] }

[[term]]
id = "evp-999"
definition = "Eggsecutive VP at the maximum of 999 points."
forms = { en = ["EVP 999", "max rank"], ja = ["カンスト"] }

[[term]]
id = "xtrawave"
definition = "Fourth wave against a King Salmonid once the meter is full."
forms = { en = ["Xtrawave", "XTRAWAVE"], ja = ["EX-WAVE"] }

[[term]]
id = "big-run"
definition = "Limited-time event where Salmonids attack a PvP stage."
forms = { en = ["Big Run"], ja = ["ビッグラン"], zh = ["大型跑"] }

[[term]]
id = "eggstra-work"
definition = "Limited-time contest: five waves with a fixed weapon set, scored by Golden Eggs."
forms = { en = ["Eggstra Work"], ja = ["バイトチームコンテスト", "チームコンテスト"] }

[[term]]
id = "grizzco"
definition = "The company (Mr. Grizz) that runs Salmon Run jobs."
forms = { en = ["Grizzco"], ja = ["クマサン商会"], zh = ["熊先生商会"] }

[[term]]
id = "high-tide"
definition = "Water level with a smaller shore area."
# unsure: the zh names of the tides
forms = { en = ["High Tide"], ja = ["満潮"], zh = ["满潮", "涨潮"] }

[[term]]
id = "normal-tide"
definition = "The regular water level."
forms = { en = ["Normal Tide", "mid tide"], ja = ["通常"] }

[[term]]
id = "low-tide"
definition = "Water level exposing the lower shore; the basket moves down."
# unsure: the zh names of the tides
forms = { en = ["Low Tide"], ja = ["干潮"], zh = ["干潮", "退潮"] }

[[term]]
id = "steelhead"
definition = "Boss that grows a bomb on its head and throws it; shoot the bomb to detonate it on the boss."
forms = { en = ["Steelhead"], ja = ["バクダン"], zh = ["炸弹鱼"] }

[[term]]
id = "flyfish"
definition = "Boss with two missile pods; throw a bomb into each open pod."
forms = { en = ["Flyfish"], ja = ["カタパッド"], zh = ["垫肩飞鱼"] }

[[term]]
id = "steel-eel"
definition = "Boss that chases one player leaving ink; shoot the driver at the tail."
forms = { en = ["Steel Eel"], ja = ["ヘビ"], zh = ["蛇鱼"] }

[[term]]
id = "scrapper"
definition = "Armored boss; hit it from the front to stun it, then shoot the exposed back."
forms = { en = ["Scrapper"], ja = ["テッパン"], zh = ["铁板鱼"] }

[[term]]
id = "stinger"
definition = "Tower of pots that snipes from the shore; shoot the pots off from the side."
