# ---------------------------------------------------------------------------
# Player jargon (the studio's chat examples). English forms marked "unsure"
# are literal or descriptive: the English community may have no fixed word.

[[term]]
id = "inertia-cancel"
definition = "Movement technique that cancels the momentum of a jump or dash so the player stops or turns at once; used to keep egg runs tight."
# unsure: no established English community term found; "inertia cancel" is literal
forms = { en = ["inertia cancel", "momentum cancel"], zh = ["惯性取消"] }

[[term]]
id = "egg-run"
definition = "Carrying Golden Eggs to the basket."
forms = { en = ["egg run", "egg running", "carry eggs", "running eggs"], ja = ["納品"], zh = ["搬蛋", "运蛋"] }

[[term]]
id = "grizzco-weapon"
definition = "A Grizzco-brand weapon (the gold rental Splatana, Brush, Slosher, Charger, Blaster, Stringer or Dualies); Chinese players call one a bear weapon, and this player's 熊刷 is one (often the Grizzco Splatana or Brush)."
# unsure: whether 熊刷 means any Grizzco weapon or the Grizzco Brush / Splatana only
forms = { en = ["Grizzco weapon", "bear weapon"], ja = ["クマブキ", "クマサン武器"], zh = ["熊武", "熊刷", "熊武器"] }

[[term]]
id = "killer-wail-51"
definition = "Special weapon: six laser megaphones lock on and fire; in Salmon Run it clears lesser Salmonids and hits bosses at range."
forms = { en = ["Killer Wail 5.1", "wail"], ja = ["メガホンレーザー5.1ch", "メガホン"], zh = ["喇叭镭射5.1", "镭射", "喇叭"] }

[[term]]
id = "fetch-eggs"
definition = "Leaving the basket area to collect Golden Eggs lying farther out, then coming back; a short trip, not a post."
# unsure: 出差 ("business trip") has no fixed English equivalent
forms = { en = ["fetch eggs", "go out for eggs", "egg trip"], zh = ["出差"] }

[[term]]
id = "short-range-weapon"
definition = "A light, short-ranged weapon (Splattershot Jr., Sploosh-o-matic, Aerospray, ...): quick at running eggs, weak against bosses at range."
# unsure: 小枪 ("small gun") is descriptive; English players say "short-range weapon" or name the weapon
forms = { en = ["short-range weapon", "short-range shooter", "light weapon"], zh = ["小枪"] }

[[term]]
id = "outer-eggs"
definition = "Golden Eggs lying at the edge of the stage, away from the basket."
# unsure: descriptive English
forms = { en = ["outer eggs", "far eggs", "eggs on the outside"], zh = ["外围蛋"] }
