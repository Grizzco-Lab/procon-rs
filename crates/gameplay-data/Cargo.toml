[package]
name = "gameplay-data"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
numpy = { version = "0.29.0", optional = true }
pyo3 = { version = "0.29.2", features = ["abi3-py310", "anyhow"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# Python bindings (built by maturin, see pyproject.toml)
python = ["dep:pyo3", "dep:numpy"]
