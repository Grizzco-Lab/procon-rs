[proxy]
# The machine running `procon-proxy`: its address and [stream] port
address = "192.168.4.94:7331"
# Its [replay] port, where the replay panel plays actions
replay_address = "192.168.4.94:7332"

[web]
# Dashboard port (8080 is taken on this host)
port = 8090

[recording]
# Session folders are <prefix>YYYY-MM-DD_HH-MM-SS/; the dashboard can change it
prefix = "recordings/"

[video]
# Input at first launch: "screen", a device like "/dev/video0", or "" for none
input = "/dev/video0"
# Capture frame rate
fps = 60
# Elgato 4K X mode, the same one OBS uses: YUYV 1920x1080
v4l2_args = ["-input_format", "yuyv422", "-video_size", "1920x1080"]
# Recorded size (1080, 720, 540 or 360; 16:9) and frame rate; the dashboard can change both
record_height = 720
record_fps = 30
# NVENC H.264; use ["-c:v", "libx264", "-preset", "veryfast", "-crf", "20"] without an NVIDIA GPU
encoder = ["-c:v", "h264_nvenc", "-preset", "p5", "-cq", "23", "-bf", "0"]
extension = "mkv"
# Live preview in the dashboard: H.264 played by the browser. The dashboard can
# make it follow the recording size and rate instead.
preview_height = 1080
preview_fps = 60
# Low latency NVENC; use ["-c:v", "libx264", "-preset", "ultrafast", "-tune", "zerolatency", "-b:v", "6M"] without an NVIDIA GPU
# Sound track of the recordings: a PulseAudio source (pactl list short sources), "" for none
audio_input = "alsa_input.usb-Elgato_Elgato_4K_X_A7SNB42310Y75A-02.analog-stereo"
# How much later that sound arrives than the picture, in ms
audio_offset_ms = 0
preview_encoder = ["-c:v", "h264_nvenc", "-preset", "p1", "-tune", "ll", "-zerolatency", "1", "-delay", "0", "-b:v", "6M", "-maxrate", "8M", "-bufsize", "2M"]

[inspect]
# Folder of session folders for the Inkspector; by default the recording prefix's folder
# root = "/data/procon"
# AgentZero's per-session video delays, relative to this file (a missing file means none)
# calibration = "../AgentZero/calibration.json"
# Object labels drawn in the Inkspector; by default "Annotations" next to the root
# annotations = "/data/Annotations"

[cuttlefish]
# Reviews, one folder each (review.json and its video); by default "Reviews"
# next to the Inkspector's root
# reviews = "/data/Reviews"
# Knowledge store and embedding model of the cuttlefish crate; by default
# $CUTTLEFISH_DATA or ~/.local/share/cuttlefish. "Ask Cuttlefish" needs
# ANTHROPIC_API_KEY in the studio's environment (never put it in a file here)
# knowledge = "/data/cuttlefish"
# model = "claude-opus-5-5"

[logging]
# Log level: error, warn, info, debug, trace
level = "info"
