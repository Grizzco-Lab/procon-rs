[proxy]
# The machine running `procon-proxy`: its address and [stream] port
address = "192.168.4.94:7331"
# Its [replay] port, where the replay panel plays actions
replay_address = "192.168.4.94:7332"

[web]
# Dashboard port (8080 is taken on this host)
port = 8090
# Host names besides localhost and IP addresses the dashboard answers to,
# e.g. a name that points at this machine; requests for other names, and
# requests coming from other sites, are refused
# allowed_hosts = ["studio.cjr.host"]

[recording]
# Session folders are <prefix>YYYY-MM-DD_HH-MM-SS/; the dashboard can change it
prefix = "recordings/"

[video]
# Input at first launch: "screen", a device like "/dev/video0", a video file
# (played in a loop as if live, to try the studio without a console), or ""
# for none
input = "/dev/video0"
# Capture frame rate
fps = 60
# Elgato 4K X mode, the same one OBS uses: YUYV 1920x1080
v4l2_args = ["-input_format", "yuyv422", "-video_size", "1920x1080"]
# Recorded size (1080, 720, 540 or 360; 16:9) and frame rate; the dashboard can change both
record_height = 720
record_fps = 30
# NVENC H.264; use ["-c:v", "libx264", "-preset", "veryfast", "-crf", "20"] without an NVIDIA GPU
encoder = ["-c:v", "h264_nvenc", "-preset", "p5", "-cq", "23", "-bf", "0"]
extension = "mkv"
# Live preview in the dashboard: H.264 played by the browser. The dashboard can
# make it follow the recording size and rate instead.
preview_height = 1080
preview_fps = 60
# Low latency NVENC; use ["-c:v", "libx264", "-preset", "ultrafast", "-tune", "zerolatency", "-b:v", "6M"] without an NVIDIA GPU
# Sound track of the recordings: a PulseAudio source (pactl list short sources), "" for none
audio_input = "alsa_input.usb-Elgato_Elgato_4K_X_A7SNB42310Y75A-02.analog-stereo"
# How much later that sound arrives than the picture, in ms
audio_offset_ms = 0
preview_encoder = ["-c:v", "h264_nvenc", "-preset", "p1", "-tune", "ll", "-zerolatency", "1", "-delay", "0", "-b:v", "6M", "-maxrate", "8M", "-bufsize", "2M"]

[inspect]
# Folder of session folders for the Inkspector; by default the recording prefix's folder
# root = "/data/procon"
# AgentZero's per-session video delays, relative to this file (a missing file means none);
# its sessions.json beside it gives the camera turn fits, the truth's camera turn
# calibration = "../AgentZero/calibration.json"
# Object labels drawn in the Inkspector; by default "Annotations" next to the root
# annotations = "/data/Annotations"
# Box tracker behind Follow in the labeling mode (AgentZero's agentzero-track-serve)
# tracker = "http://127.0.0.1:7340"
# What the page's "Start tracker" runs, and where (relative to this file)
# tracker_command = ["uv", "run", "agentzero-track-serve", "--port", "7340"]
# tracker_dir = "../AgentZero"

[vision]
# The Salmon Run detector in the Vision app (AgentZero's agentzero-detect-serve)
# detector = "http://127.0.0.1:7341"
# What the page's "Start detector" runs, and where (relative to this file)
# detector_command = ["uv", "run", "agentzero-detect-serve", "--port", "7341"]
# detector_dir = "../AgentZero"

[cuttlefish]
# Reviews, one folder each (review.json and its video); by default "Reviews"
# next to the Inkspector's root
# reviews = "/data/Reviews"
# Knowledge store of the cuttlefish crate (documents, index, glossary, and the
# inbox/ folder to drop material into); by default "Knowledge" next to the
# Inkspector's root. It may be a synced folder; the embedding model stays in
# ~/.cache/procon-cuttlefish. The chat needs a model backend: ANTHROPIC_API_KEY
# in the studio's environment (never put it in a file here), or the logged-in
# Claude Code CLI on your own subscription
# knowledge = "/data/Knowledge"
# What answers: "auto" (the API when the key is set, else `claude` on PATH),
# "api" or "claude-cli"
# backend = "auto"
# Models for the chat and the translator; by default the backend's own
# model = "claude-opus-5-5"
# translate_model = "claude-sonnet-4-5"
# Slang suggestions (Translate view, Slang panel): approve at once what the
# model is at least slang_threshold sure of (you can undo each in the panel);
# the rest waits for review
# slang_auto_apply = true
# slang_threshold = 0.6

[logging]
# Log level: error, warn, info, debug, trace
level = "info"
