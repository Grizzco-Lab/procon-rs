[package]
name = "procon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
env_logger = "0.11.8"
log = "0.4.27"
chrono = { version = "0.4.41", features = ["serde"] }
libc = "0.2.175"
num_cpus = "1.17.0"
toml = "0.9.5"
clap = { version = "4.5.45", features = ["derive"] }
usb-gadget = "0.7.5"
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
warp = { version = "0.4.1", features = ["websocket", "server"] }
futures-util = "0.3.31"
gameplay-data = { version = "0.1.0", path = "crates/gameplay-data" }
cuttlefish = { version = "0.1.0", path = "crates/cuttlefish" }
gameplay-vision = { version = "0.1.0", path = "crates/gameplay-vision" }

[features]
# The Vision app's detector on an NVIDIA GPU; needs the CUDA toolkit (nvcc)
cuda = ["gameplay-vision/cuda"]

[[bin]]
name = "procon"
path = "src/bin/main.rs"

[workspace]
members = ["crates/*"]
