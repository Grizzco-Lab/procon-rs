[package]
name = "procon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
hidapi = "2.6.3"
env_logger = "0.11.8"
log = "0.4.27"
chrono = { version = "0.4.41", features = ["serde"] }
libc = "0.2.175"
num_cpus = "1.17.0"
smallvec = "1.15.1"
toml = "0.9.5"
clap = { version = "4.5.45", features = ["derive"] }


[[bin]]
name = "procon"
path = "src/bin/main.rs"
